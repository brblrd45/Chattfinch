[project]
name = "chattfinch"
version = "0.1.0"
description = "Ask a Birder: a RAG assistant over the birds of Kazakhstan"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the paid LLM API; skipped unless pytest is run with --live"]
